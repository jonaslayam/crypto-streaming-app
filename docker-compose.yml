# Common logging configuration to save disk space
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda
    restart: unless-stopped
    logging: *default-logging
    command:
      - redpanda start
      - --smp 1 
      - --memory 2G 
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${BROKER_EXTERNAL_IP}:19092
      - --set redpanda.auto_create_topics_enabled=true
      - --set redpanda.default_topic_partitions=4
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G
    networks:
      - streaming-net
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 20s
      timeout: 5s
      retries: 5

  console:
    restart: unless-stopped
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    logging: *default-logging
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    networks:
      - streaming-net
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - streaming-net
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: ./producer/Dockerfile
    container_name: producer
    env_file:
      - .env
    command: bash -c "python setup_redpanda.py && python main.py"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - streaming-net
    environment:
      - TZ=America/Santiago
      - REDIS_HOST=redis
      - KAFKA_BROKER=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Verifica si el productor ha enviado un mensaje en los últimos 70 minutos.
      # El timeframe es de 1h, así que damos un margen extra para evitar falsos positivos.
      test: ["CMD-SHELL", "find /tmp/producer_healthy -mmin -70 || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      # Damos un margen inicial para que el backfill se complete
      start_period: 5m

  processor:
    build:
      context: .
      dockerfile: ./processor/Dockerfile
    container_name: processor
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging
    networks:
      - streaming-net
    environment:
      - TZ=America/Santiago
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  flink-jobmanager:
    image: flink:1.20
    container_name: flink-jobmanager
    restart: unless-stopped
    logging: *default-logging
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend: rocksdb
    networks:
      - streaming-net
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5

  flink-taskmanager:
    image: flink:1.20
    container_name: flink-taskmanager
    restart: unless-stopped
    logging: *default-logging
    depends_on: 
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend: rocksdb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
    networks:
      - streaming-net
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

volumes:
  redpanda-data:
  flink-checkpoints:
  redis-data:

networks:
  streaming-net:
    driver: bridge
